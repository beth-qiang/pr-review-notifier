[project]
name = "prn"
version = "0.1.0"
description = "PR Review Notifier: a local GitHub PR inbox with a macOS menu bar app, notifications, and a TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "typer>=0.12",
  "rich>=13.7",
  "textual>=0.60",
  "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
prn = "prn.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prn"]

# Ship the committed example config inside the package (single source of truth at repo root).
[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "prn/config.example.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
